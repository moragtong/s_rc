[package]
name = "s_rc"
version = "0.1.0"
edition = "2024"
default-run = "s_rc"

[dependencies]
bevy = "0.19.1"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
